<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4eNEXT to owlbear · 骰子</title>
<link rel="stylesheet" href="assets/ui.css">
</head>
<body class="win-page">
<!-- v1.7.0：骰子（独立窗口，**单列**）。v1.5.0 的两栏右栏（本次结果 + 团队记录）已经拆开：
       · 本次结果留在本窗口（投骰动画打不开 / 被关掉时照样看得见点数）；
       · 团队记录搬去**独立的记录窗口** dice-history.html（最近 4 条，可展开全部，自己的 id + 可拖动）；
       · 投骰动画（effect.html）由 assets/dice-page.js 在算完结果后打开，开关在「设置」窗口里。
     左列内容：骰子按钮 / 表达式 / 战斗优势 +2 / 重击取满 / 4E 预设（攻击 · 伤害 · 技能）/ 组合。
     规则与掷骰在 assets/dice-core.js（纯函数），4E 预设在 assets/dice-4e.js（动态加载）。 -->
<div class="win">
  <div class="win-head" id="head" title="按住这里拖动窗口（位置会记住）">
    <span class="grip" aria-hidden="true">⠿</span>
    <div class="t"><b>骰子 · 4eNEXT to owlbear</b><small>表达式 · 战斗优势 +2 · 重击取满 · 记录独立窗口</small></div>
    <div class="sp">
      <button class="icon-btn" id="pin" title="回到默认位置（清除本窗口记住的位置）">⌖</button>
      <button class="icon-btn" id="close" title="关闭窗口">✕</button>
    </div>
  </div>

  <div class="bg-strip" id="bg-strip">
    <span class="bg-text" id="bg-text">正在确认后台脚本…</span>
    <button class="btn small" id="bg-retry" hidden>后台未连接，点这里重试</button>
  </div>

  <div class="win-body dice-wrap">
    <div class="dice-cols">
      <section class="dice-left">
        <div class="dice-sec">
          <div class="sec-head">
            <h3>骰子</h3>
            <span class="sec-hint">左键 +1 · 右键 −1</span>
          </div>
          <div class="dice-row" id="diceRow">
            <button class="dice-btn" type="button" data-die="d4" data-count="0" data-bg-soft>
              <span class="face">d4</span><span class="badge">0</span>
            </button>
            <button class="dice-btn" type="button" data-die="d6" data-count="0" data-bg-soft>
              <span class="face">d6</span><span class="badge">0</span>
            </button>
            <button class="dice-btn" type="button" data-die="d8" data-count="0" data-bg-soft>
              <span class="face">d8</span><span class="badge">0</span>
            </button>
            <button class="dice-btn" type="button" data-die="d10" data-count="0" data-bg-soft>
              <span class="face">d10</span><span class="badge">0</span>
            </button>
            <button class="dice-btn" type="button" data-die="d12" data-count="0" data-bg-soft>
              <span class="face">d12</span><span class="badge">0</span>
            </button>
            <button class="dice-btn" type="button" data-die="d20" data-count="0" data-bg-soft>
              <span class="face">d20</span><span class="badge">0</span>
            </button>
            <button class="dice-btn" type="button" data-die="d100" data-count="0" data-bg-soft>
              <span class="face">d100</span><span class="badge">0</span>
            </button>
          </div>
        </div>

        <div class="dice-sec">
          <div class="sec-head">
            <h3>表达式</h3>
            <span class="sec-hint">2d6+5 / adv(1d20) / max(1d6,4)</span>
          </div>
          <div class="expr-row">
            <button class="btn step" type="button" id="btnModMinus" title="加值 −1">−</button>
            <input class="expr-input" id="exprInput" autocomplete="off" spellcheck="false" placeholder="1d20 + 5">
            <button class="btn step" type="button" id="btnModPlus" title="加值 +1">＋</button>
          </div>
          <div class="dice-acts">
            <button class="btn primary" type="button" id="btnRoll" data-bg-soft title="投掷（Enter 也可以）">投掷</button>
            <button class="btn" type="button" id="btnLast" data-bg-soft title="填回上一次掷过的公式">上一次</button>
            <button class="btn" type="button" id="btnSave" data-bg-soft title="把当前公式存成本机组合">保存组合</button>
            <button class="btn toggle" type="button" id="btnHist" data-bg-soft title="打开 / 收起独立的骰子记录窗口（最近 4 条）">记录窗口</button>
          </div>
          <div class="dice-acts">
            <button class="btn toggle" type="button" id="btnAdvantage" data-bg-soft title="4E 战斗优势：公式 +2（再点一下撤回）">战斗优势 +2</button>
            <button class="btn toggle" type="button" id="btnCrit" data-bg-soft title="4E 重击：所有伤害骰取最大值（d6→6），不是骰数翻倍">重击 · 伤害取满</button>
            <button class="btn ghost" type="button" id="btnClear" data-bg title="清空全桌记录（只有城主能做，要点两次）">清空记录</button>
          </div>
        </div>

        <div class="dice-sec">
          <div class="sec-head">
            <h3>本次结果</h3>
            <span class="sec-hint" id="animMeta">投骰动画：开</span>
          </div>
          <div class="res-box" id="result">
            <div class="res-empty">还没掷过。点一颗骰子，再点「投掷」。</div>
          </div>
        </div>

        <div class="dice-sec">
          <div class="sec-head">
            <h3>4E 预设</h3>
            <span class="sec-hint" id="presetMeta">选中已绑定角色卡的 token</span>
          </div>
          <div class="preset-box" id="presets">
            <p class="muted small">选中一枚已绑定角色卡的 token，这里会出现攻击 / 伤害 / 技能预设（只填公式，不判定）。</p>
          </div>
          <div class="def-ref" id="defenseRef"></div>
        </div>

        <div class="dice-sec">
          <div class="sec-head">
            <h3>组合</h3>
            <span class="sec-hint">只存本机</span>
          </div>
          <div class="combo-row">
            <input class="combo-name" id="comboName" autocomplete="off" maxlength="24" placeholder="组合名（可空）">
          </div>
          <div class="combo-box" id="combos"></div>
        </div>
      </section>
    </div>
  </div>

  <div class="win-foot">
    <span class="win-flash" id="win-flash"></span>
    <span class="win-hint">按住标题栏可拖动 · 记录窗口独立开关 · 动画在「设置」里关</span>
  </div>
</div>
<script type="module" src="assets/dice-page.js"></script>
</body>
</html>
