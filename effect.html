<!doctype html>
<html lang="zh-CN" style="color-scheme:normal!important;background:transparent!important">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- v1.8.0：跟 initiative.html 一样加 darkreader-lock —— 暗色扩展看到它就不处理本页；
     否则它注入的 html{background:#181a1b!important} 会把「整页透明」的动画层重新染深。 -->
<meta name="darkreader-lock">
<title>4eNEXT to owlbear · 投骰动画</title>
<link rel="stylesheet" href="assets/ui.css?v=2.5.8">
<!-- v1.7.1：**整页完全透明**（修「投完骰地图被全屏黑盖住」）。
     黑底不是 OBR 的 backdrop（hideBackdrop 已生效），而是 assets/ui.css 顶部那句
     `html, body { background: var(--bg) }`：v1.7.0 只给 body.fx-page 盖了 transparent，
     html 仍然是不透明的深色 #0b0f14，body 一透明，下面那层 html 的黑就从整个 iframe 透出来，
     把地图整块糊住。所以这里连 html 一起钉成 transparent（!important 盖掉 ui.css），
     color-scheme 也退回 normal —— 深色 color-scheme 会让浏览器给透明 iframe 垫一层深色 canvas。 -->
<style>
  html, body.fx-page { background: transparent !important; color-scheme: normal !important; }
  #app, .fx-root, .fx-stage, .fx-wrap { background: transparent !important; }
</style>
<!-- v1.8.0（交接文件 §3.3）：光有样式表 !important 压不住 OBR / Dark Reader 后注入的 !important，
     必须补 **inline style 的 !important**（级联里高于任何选择器 !important）+ 首帧前生效的三件套。
     这里是静态单形态页面，直接写在 html / body 的 style 属性上即可。 -->
<style data-overlay-canvas>
  :root { color-scheme: normal !important; background: transparent !important; }
  body:not(.config), #root, #app, .fx-root, .fx-stage, .fx-wrap {
    background: transparent !important;
    background-color: transparent !important;
  }
</style>
</head>
<body class="fx-page" style="background:transparent!important">
<!-- v1.7.0：投骰动画页（全屏 modal，由 assets/dice-page.js 在**算完结果之后**打开）。
     布局 / 时间轴公式照抄 docs/spec-dice.md §4（来源 FullPeople/obr-suite 的
     src/modules/dice/effect-page.ts + 仓库根 dice-effect.html），数值在 assets/dice-core.js 的
     fxBaseSize / fxDieSize / fxLayout / fxBeat，本页只把结果摆到屏幕上。
     · 背景透明（hideBackdrop + hidePaper），**整层 pointer-events:none**：骰子不挡鼠标，
       动画期间照样能平移 / 选中地图（参考实现就是这么做的，见 dice-effect.html 的注释）；
     · 骰子数量、尺寸、换行、居中、附属元素位置全部由 fxLayout 算，CSS 只做关键帧；
     · 播放完（2600 ms）自己关掉，**另挂 3000 ms 兜底**（动画被打断也不会留一层），
       ESC / 点击任意处也立即关；出任何错就把这一层隐藏并关闭 —— 结果早已显示在骰子窗口里。 -->
<div class="fx-stage" id="fx-stage">
  <div class="fx-flash" id="fx-flash" aria-hidden="true"></div>
  <div class="fx-wrap" id="fx-wrap">
    <div class="fx-total" id="fx-total"><span class="fx-total-num" id="fx-total-num">0</span></div>
    <div class="fx-mod" id="fx-mod">
      <span class="fx-mod-num" id="fx-mod-num"></span>
      <span class="fx-mod-label" id="fx-mod-label"></span>
    </div>
  </div>
</div>
<script type="module" src="assets/effect-page.js?v=2.5.8"></script>
</body>
</html>
