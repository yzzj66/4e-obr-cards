<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4eNEXT to owlbear · 血条组件</title>
<link rel="stylesheet" href="assets/ui.css?v=1.10.0">
</head>
<body class="win-page hpe-page">
<!-- v1.10.0：血条编辑窗照 Full Suite 的 hp-bar 重做（第一批：布局 + 字段）。
     窗口约 344×106：名称行（⣿ 拖动柄 + 居中卡名 + 钉住 / 锁定 / 重绘 + ✕）、
     生命药丸（当前 / 上限，按 cur/max 比例填充）+ 临时生命药丸、四防四个小输入、底部状态行。
     **已去掉「回复力」字段**（surges 数据只读不写，保留在 token 上）；四防保留；新增临时生命 temp。
     交互：聚焦全选、失焦 / Enter 提交、非法输入回退、saving 时输入禁用、clamp（照 hp-edit-core.js）。
     窗口壳（拖动 / 位置记忆 / 后台检测）与其它窗口共用 assets/window.js。 -->
<div class="win hpe">
  <div class="win-head hpe-head" id="head" title="按住这里拖动窗口（位置会记住）">
    <span class="grip hpe-grip" aria-hidden="true" title="拖动柄">⣿</span>
    <div class="t hpe-title"><b id="hpe-name">未命名</b></div>
    <span class="hpe-off" id="hpe-off" hidden title="后台脚本没有响应：改动仍会写进 token，但血条要等后台恢复才会重画">后台未连接</span>
    <div class="sp hpe-tools">
      <button class="icon-btn hpe-icon" id="hpe-pin" title="钉住：选中变化 / 取消选中时不自动关窗">📌</button>
      <button class="icon-btn hpe-icon" id="hpe-lock" title="锁定：玩家看不到精确数字（再点解锁）">🔒</button>
      <button class="icon-btn hpe-icon" id="hpe-repaint" title="重绘血条：强制重算血条环 / 四防盾 / 资源徽记">↻</button>
      <button class="icon-btn" id="close" title="关闭编辑窗（血条组件保持开启）">✕</button>
    </div>
  </div>

  <div class="hpe-body">
    <div class="hpe-row hpe-pills">
      <div class="hpe-pill hpe-hp-pill" id="hpe-hp-pill" title="生命：当前 / 上限（背景按当前/上限比例填充）">
        <input class="hpe-num" id="hpe-cur" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" data-bg-soft placeholder="0" aria-label="当前生命">
        <span class="hpe-sep">/</span>
        <input class="hpe-num" id="hpe-max" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" data-bg-soft placeholder="20" aria-label="生命上限">
        <span class="hpe-unit">HP</span>
      </div>
      <div class="hpe-pill hpe-temp-pill" title="临时生命（0~999，不参与血条比例）">
        <span class="hpe-unit">临时</span>
        <input class="hpe-num" id="hpe-temp" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" data-bg-soft placeholder="0" aria-label="临时生命">
      </div>
    </div>

    <div class="hpe-row hpe-defs">
      <label class="hpe-def" title="AC（护甲等级）"><span>AC</span>
        <input class="hpe-num" id="hpe-def-ac" data-bg-soft type="text" inputmode="numeric" autocomplete="off" placeholder="—"></label>
      <label class="hpe-def" title="强韧（Fortitude）"><span>强韧</span>
        <input class="hpe-num" id="hpe-def-fort" data-bg-soft type="text" inputmode="numeric" autocomplete="off" placeholder="—"></label>
      <label class="hpe-def" title="反射（Reflex）"><span>反射</span>
        <input class="hpe-num" id="hpe-def-reflex" data-bg-soft type="text" inputmode="numeric" autocomplete="off" placeholder="—"></label>
      <label class="hpe-def" title="意志（Will）"><span>意志</span>
        <input class="hpe-num" id="hpe-def-will" data-bg-soft type="text" inputmode="numeric" autocomplete="off" placeholder="—"></label>
    </div>

    <div class="hpe-status">
      <span class="hpe-note" id="hpe-note">填生命上限（比如 20）就能画出第一根血条</span>
      <span class="win-flash" id="win-flash"></span>
    </div>
  </div>
</div>
<script type="module" src="assets/hp-edit-page.js?v=1.10.0"></script>
</body>
</html>
