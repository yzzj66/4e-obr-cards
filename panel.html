<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4eNEXT to owlbear · 角色卡</title>
<link rel="stylesheet" href="assets/ui.css?v=2.4.37">
<link rel="stylesheet" href="assets/glance.css?v=2.4.37">
</head>
<body class="win-page">
<!-- v1.3.1：「角色卡面板」只负责**导入 / 列表 / 预览 / 绑定**（用户口中的「导入面板」）。
     先攻、骰子已经拆成各自独立的窗口（initiative.html / dice.html），这里**不再有 tab**。
     面板打开时由后台按视口夹紧尺寸，内部列表与预览各自独立滚动，所以任何屏幕都看得全。 -->
<div class="panel">
  <header class="panel-top" id="head" title="按住这里可以拖动窗口（popover 模式下有效，位置会记住）">
    <span class="grip" aria-hidden="true">⠿</span>
    <div class="panel-title">4eNEXT to owlbear</div>
    <div class="panel-top-right">
      <button class="icon-btn" id="pin" title="回到默认位置（清除本面板记住的位置）">⌖</button>
      <button class="icon-btn" id="close" title="关闭面板">✕</button>
    </div>
  </header>

  <!-- v1.7.6：状态条默认整条隐藏（没有异常就不显示）；只有「后台未连接」这类错误才由 window.js 放出来。 -->
  <div class="bg-strip" id="bg-strip" hidden>
    <span class="bg-text" id="bg-text"></span>
    <button class="btn small" id="bg-retry" hidden>后台未连接，点这里重试</button>
  </div>

  <div class="panel-body">
    <aside class="panel-side">
      <div class="import-box">
        <div class="row">
          <button class="btn primary small" id="pick" data-bg-soft>导入 JSON</button>
          <button class="btn small" id="paste-toggle" data-bg-soft>粘贴</button>
          <button class="btn small ghost" id="sample" data-bg-soft>载入示例</button>
        </div>
        <input type="file" id="file" accept=".json,application/json" multiple hidden>
        <div id="paste-wrap" style="display:none;margin-top:8px">
          <textarea id="paste" placeholder="把 4E NEXT「导出存档」或「导出全部数据（备份）」的 JSON 全文粘贴到这里"></textarea>
          <button class="btn small" id="paste-ok" data-bg-soft style="margin-top:6px">导入这段 JSON</button>
        </div>
        <div class="drop-hint" style="margin-top:8px">也可以把「导出存档」或「导出全部数据」的 .json 文件直接拖进窗口</div>
      </div>
      <div class="sel-token" id="sel">未选中 token</div>
      <div class="card-list" id="list"></div>
    </aside>
    <main class="panel-main"><div class="panel-main-inner" id="view"></div></main>
  </div>

  <div class="win-foot">
    <span class="win-flash" id="win-flash"></span>
  </div>
</div>
<div class="drag-overlay" id="overlay"><b>松手导入 4E NEXT JSON（导出存档 / 全量备份）</b></div>
<script type="module" src="assets/panel.js?v=2.4.37"></script>
</body>
</html>
