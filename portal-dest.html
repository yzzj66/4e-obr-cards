<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4eNEXT to owlbear · 传送目的地</title>
<link rel="stylesheet" href="assets/ui.css?v=2.5.8">
<style>
  html, body.pd-page { height: 100%; }
  body.pd-page { margin: 0; padding: 0; overflow: hidden; box-sizing: border-box; }
  body.pd-page .win { height: 100vh; max-height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; }
  .pd-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 8px 12px 12px; box-sizing: border-box; overflow: hidden; border: 0; background: transparent; border-radius: 0; box-shadow: none; }
  .dest-list { flex: 1 1 auto; min-height: 72px; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; border: 0; background: transparent; border-radius: 0; box-shadow: none; }
  .dest-empty { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 12px; color: #93a1b0; font-size: 11px; text-align: center; }
  .dest-list button.dest {
    flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    min-height: 32px; padding: 8px 2px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
    background: transparent; color: #e6edf3; cursor: pointer; text-align: left; font-size: 12px; box-sizing: border-box;
  }
  .dest-list button.dest:last-child { border-bottom: 0; }
  .dest-list button.dest:hover { background: rgba(63, 139, 255, .08); }
  .dest-list .tag { font-size: 10px; color: #93a1b0; }
  .dest-foot { flex: 0 0 auto; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding-top: 2px; }
  .dest-foot .hint { flex: 1 1 auto; min-width: 0; font-size: 10.5px; color: #93a1b0; line-height: 1.4; }
  .dest-foot .btn { flex: 0 0 auto; }
  .pd-close { font-size: 14px; line-height: 1; }
</style>
</head>
<body class="win-page pd-page">
<div class="win pd">
  <div class="win-head" id="head" title="按住这里拖动窗口（位置会记住）">
    <span class="grip" aria-hidden="true" title="拖动柄">⣿</span>
    <div class="t"><b>选择传送目的地</b></div>
    <div class="sp"><button class="icon-btn pd-close" id="pd-close-x" type="button" title="关闭（Esc）">✕</button></div>
  </div>
  <div class="win-body pd-body">
    <div class="dest-list" id="pd-list"></div>
    <div class="dest-foot">
      <button class="win-btn" id="pd-close" type="button" data-bg-soft>取消</button>
    </div>
  </div>
</div>
<script type="module" src="assets/portal-dest-page.js?v=2.5.8"></script>
</body>
</html>
