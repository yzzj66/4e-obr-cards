<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4eNEXT to owlbear · 传送门编辑</title>
<link rel="stylesheet" href="assets/ui.css?v=2.4.22">
<style>
  html, body { height: 100%; }
  body.pe-page { padding: 0; overflow: hidden; height: 100vh; }
  body.pe-page .win { height: 100vh; max-height: 100vh; display: flex; flex-direction: column; }
  .pe-body {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; box-sizing: border-box;
    padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 8px;
  }
  .pe-body h3 { margin: 0; font-size: 12.5px; color: #e6edf3; }
  .pe-body .row { display: flex; gap: 8px; }
  .pe-body .row .win-label { flex: 1 1 0; }
  .pe-body .checks { display: flex; gap: 14px; flex-wrap: wrap; padding: 2px 0; }
  .pe-body .foot { flex: 0 0 auto; margin-top: auto; padding-top: 4px; display: flex; gap: 8px; justify-content: flex-end; }
  .pe-close { font-size: 14px; line-height: 1; }
</style>
</head>
<body class="win-page pe-page">
<div class="win pe">
  <div class="win-head" id="head" title="按住这里拖动窗口（位置会记住）">
    <span class="grip" aria-hidden="true" title="拖动柄">⣿</span>
    <div class="t"><b>编辑传送门</b></div>
    <div class="sp"><button class="icon-btn pe-close" id="pe-close-x" type="button" title="关闭（Esc）">✕</button></div>
  </div>
  <div class="win-body pe-body">
    <h3>传送门</h3>
    <label class="win-label">名称
      <input class="win-input" id="pe-name" type="text" maxlength="40" autocomplete="off">
    </label>
    <div class="row">
      <label class="win-label">标签（同 tag 互联）
        <input class="win-input" id="pe-tag" type="text" maxlength="40" autocomplete="off">
      </label>
    </div>
    <div class="checks">
      <label class="win-check-row"><input class="win-check" id="pe-show-name" type="checkbox"> 显示名字</label>
      <label class="win-check-row"><input class="win-check" id="pe-visible" type="checkbox"> 玩家可见</label>
      <label class="win-check-row"><input class="win-check" id="pe-locked" type="checkbox"> 锁定</label>
    </div>
    <p class="win-note">同标签的传送门互为目的地。隐形门（玩家不可见）本版仅保存字段，未实现单向传送。</p>
    <div class="foot">
      <button class="win-btn" id="pe-close" type="button" data-bg-soft>取消</button>
      <button class="win-btn primary" id="pe-save" type="button" data-bg-soft>保存</button>
    </div>
  </div>
</div>
<script type="module" src="assets/portal-page.js?v=2.4.22"></script>
</body>
</html>
